<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbt AE Practice Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column under a sticky exam bar; code and feedback rendered as dbt terminal output */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #E9ECF3;
  --ink: #131824;
  --muted: #586174;
  --line: #D6DBE6;
  --accent: #3D35C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8E7FB;
  --pass: #157A46;
  --pass-soft: #E1F3E8;
  --fail: #B8352A;
  --fail-soft: #FAE6E3;
  --warn: #9A6200;
  --warn-soft: #FAEFD7;
  --term-bg: #121726;
  --term-ink: #DCE2F0;
  --term-muted: #8590A8;
  --term-line: #222A3D;
  --term-hover: #1B2236;
  --term-sel: #2A2770;
  --term-pass: #133524;
  --term-fail: #3D1A1A;
  --term-jinja: #B9B5FF;
  --term-str: #9FD8B0;
  --term-key: #8EC5FF;
  --term-pass-ink: #5FD69A;
  --term-fail-ink: #FF8C7F;
  --term-warn-ink: #F0BE5C;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1017; --surface: #151922; --surface-2: #1D222E; --ink: #E7EAF2; --muted: #9AA3B6; --line: #2A3141;
    --accent: #A5A1FF; --accent-ink: #12142B; --accent-soft: #24234A;
    --pass: #52C68D; --pass-soft: #13291E; --fail: #FF8072; --fail-soft: #331715; --warn: #E8B04A; --warn-soft: #2E2410;
    --term-bg: #0A0D14; --term-line: #1C2333; --term-hover: #151B2A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1017; --surface: #151922; --surface-2: #1D222E; --ink: #E7EAF2; --muted: #9AA3B6; --line: #2A3141;
  --accent: #A5A1FF; --accent-ink: #12142B; --accent-soft: #24234A;
  --pass: #52C68D; --pass-soft: #13291E; --fail: #FF8072; --fail-soft: #331715; --warn: #E8B04A; --warn-soft: #2E2410;
  --term-bg: #0A0D14; --term-line: #1C2333; --term-hover: #151B2A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); color: var(--ink); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 72px; }

/* Sticky exam bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.brand { border: 0; background: none; padding: 0; color: var(--ink); font: 700 16px/1 var(--font-display); cursor: pointer; letter-spacing: -.01em; }
.bar-mid { display: flex; gap: 6px 14px; flex-wrap: wrap; font: 500 13px/1.3 var(--font-mono); color: var(--muted); flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
.bar-mid strong { color: var(--ink); font-weight: 600; }
.timer { font: 600 15px/1 var(--font-mono); font-variant-numeric: tabular-nums; padding: 7px 10px; border-radius: 6px; background: var(--surface-2); }
.timer.is-low { background: var(--warn-soft); color: var(--warn); }
.progress { height: 3px; background: var(--surface-2); }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

/* Buttons */
.btn { font: 600 15px/1.2 var(--font-body); padding: 11px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-sm { padding: 7px 12px; font-size: 14px; }
.btn-ghost.is-on { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }

/* Start screen */
.eyebrow { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero { display: grid; gap: 14px; padding-block: 8px 28px; }
.lang-switch { font-size: 14px; }
.lang-switch a { color: var(--accent); font-weight: 600; }
.hero h1 { font: 700 clamp(32px, 6vw, 48px)/1.04 var(--font-display); letter-spacing: -.02em; }
.lede { max-width: 62ch; color: var(--muted); font-size: 17px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.fact { font: 500 13px/1 var(--font-mono); padding: 8px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.fact b { font-weight: 600; color: var(--accent); }
.block { display: grid; gap: 14px; padding-block: 24px; border-top: 1px solid var(--line); }
.block h2 { font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; }
.note { color: var(--muted); font-size: 14px; max-width: 70ch; }
.resume { display: grid; gap: 12px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--accent); }
.resume h2 { font: 700 19px/1.2 var(--font-display); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.seg { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.seg legend { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.seg-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.seg-opt { position: relative; display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.seg-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg-opt.is-on { border-color: var(--accent); background: var(--accent-soft); }
.seg-title { font-weight: 600; }
.seg-desc { font-size: 14px; color: var(--muted); }

.dist { display: grid; gap: 14px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: baseline; }
.dname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.dnum { font: 600 12px/1 var(--font-mono); color: var(--accent); }
.den { font-size: 13px; color: var(--muted); }
.dval { font: 500 13px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dbar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.dbar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.formats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.fmt { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 2px; }
.fmt-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.fmt-h span:last-child { font: 500 13px var(--font-mono); color: var(--muted); }
.fmt p { font-size: 14px; color: var(--muted); }

/* Question */
.qcard { display: grid; gap: 16px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qcount { font: 600 13px/1 var(--font-mono); color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.chip { font: 500 12px/1.2 var(--font-mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.chip-dom { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.qtopic { font-size: 13px; color: var(--muted); margin-top: -8px; }
.stem { font-size: 18px; line-height: 1.6; max-width: 70ch; }
.hint { font-size: 14px; color: var(--muted); }

.code { margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--term-bg); border: 1px solid var(--term-line); }
.code figcaption { font: 500 12px/1.3 var(--font-mono); color: var(--term-muted); padding: 8px 14px; border-bottom: 1px solid var(--term-line); }
.code-body { overflow-x: auto; padding-block: 10px; font: 13.5px/1.65 var(--font-mono); color: var(--term-ink); }
.cl { display: flex; width: max-content; min-width: 100%; white-space: pre; padding: 0 14px 0 11px; border-left: 3px solid transparent; }
.ln { flex: none; width: 2.4em; padding-right: 1em; text-align: right; color: var(--term-muted); user-select: none; }
.hl-btn { border-top: 0; border-right: 0; border-bottom: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.hl-btn:hover:not(:disabled) { background: var(--term-hover); }
.hl-btn:disabled { cursor: default; }
.hl-btn.is-sel { background: var(--term-sel); border-left-color: var(--term-jinja); }
.hl-btn.is-correct { background: var(--term-pass); border-left-color: var(--term-pass-ink); }
.hl-btn.is-wrong { background: var(--term-fail); border-left-color: var(--term-fail-ink); }
.t-jinja { color: var(--term-jinja); }
.t-str { color: var(--term-str); }
.t-key { color: var(--term-key); }
.t-com { color: var(--term-muted); font-style: italic; }
.t-pass { color: var(--term-pass-ink); }
.t-fail { color: var(--term-fail-ink); }
.t-warn { color: var(--term-warn-ink); }
.t-muted { color: var(--term-muted); }

.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.5; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.is-sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.opt.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.opt-key { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); font: 600 13px/1 var(--font-mono); }
.opt-key.box { border-radius: 4px; }
.opt.is-sel .opt-key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt-body { min-width: 0; padding-top: 2px; }
.opt-mark { font: 600 16px/1.6 var(--font-mono); }
.opt.is-correct .opt-mark { color: var(--pass); }
.opt.is-wrong .opt-mark { color: var(--fail); }
.opt-code { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--term-bg); color: var(--term-ink); font: 13px/1.55 var(--font-mono); white-space: pre; overflow-x: auto; }

.domc { display: grid; gap: 14px; }
.domc-meta { font: 600 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.domc-card { padding: 18px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); font-size: 17px; }
.domc-q { font-weight: 600; }
.domc-actions { display: flex; gap: 10px; }
.domc-actions .btn { min-width: 110px; }
.domc-prev { font-size: 14px; color: var(--muted); }
.domc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.domc-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.domc-item.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.domc-item.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.domc-verdict { font: 500 12px/1.6 var(--font-mono); color: var(--muted); white-space: nowrap; }

.match { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.mrow.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.mrow.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.mleft { min-width: 0; }
.mright { display: grid; gap: 6px; min-width: 0; }
.mright select { width: 100%; font: 15px/1.3 var(--font-body); padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.mfix { font-size: 14px; color: var(--pass); font-weight: 500; }

.ord { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.ord-col { display: grid; gap: 8px; min-width: 0; align-content: start; }
.ord-h { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ord-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ord-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.45; }
.ord-item:hover:not(:disabled) { border-color: var(--accent); }
.ord-item:disabled { cursor: default; color: var(--ink); }
.ord-item.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.ord-item.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.ord-plus, .ord-n { font: 600 13px/1.45 var(--font-mono); color: var(--accent); min-width: 1.2em; }
.ord-empty { font-size: 14px; color: var(--muted); padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.ord-correct { grid-column: 1 / -1; }

.fillbox { display: grid; gap: 8px; max-width: 420px; }
.fill { font: 500 17px/1.3 var(--font-mono); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.fill:focus { border-color: var(--accent); }
.fill.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.fill.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.fill-exp { font-size: 15px; }

.saved { font-size: 14px; color: var(--muted); padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }

.feedback { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.logline { background: var(--term-bg); color: var(--term-ink); font: 13px/1.5 var(--font-mono); padding: 10px 14px; white-space: pre; overflow-x: auto; }
.fb-body { display: grid; gap: 10px; padding: 16px 18px 18px; max-width: 76ch; }
.fb-title { font: 700 19px/1.2 var(--font-display); }
.fb-pass .fb-title { color: var(--pass); }
.fb-fail .fb-title { color: var(--fail); }
.fb-skip .fb-title { color: var(--warn); }
.fb-body .doc { font-weight: 600; font-size: 15px; justify-self: start; }

.actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.actions > div { display: flex; gap: 10px; flex-wrap: wrap; }
.confirm { margin-top: 14px; display: grid; gap: 12px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--warn); background: var(--warn-soft); }

.map { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; }
.map summary { cursor: pointer; font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); display: inline-block; }
.legend i.answered { background: var(--accent-soft); border-color: var(--accent); }
.legend i.correct { background: var(--pass-soft); border-color: var(--pass); }
.legend i.wrong { background: var(--fail-soft); border-color: var(--fail); }
.legend i.flagged { background: var(--warn); border-color: var(--warn); border-radius: 50%; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.pcell { position: relative; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13px/1 var(--font-mono); cursor: pointer; font-variant-numeric: tabular-nums; }
.pcell.answered { background: var(--accent-soft); border-color: var(--accent); }
.pcell.correct { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
.pcell.wrong { background: var(--fail-soft); border-color: var(--fail); color: var(--fail); }
.pcell.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.pcell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

/* Results */
.res-head { display: grid; gap: 14px; padding-bottom: 24px; }
.res-head h1 { font: 700 clamp(30px, 5vw, 42px)/1.05 var(--font-display); letter-spacing: -.02em; }
.res-score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.res-pct { font: 700 clamp(56px, 12vw, 88px)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.verdict { font: 600 14px/1 var(--font-mono); padding: 8px 12px; border-radius: 999px; }
.verdict.ok { color: var(--pass); background: var(--pass-soft); }
.verdict.no { color: var(--fail); background: var(--fail-soft); }
.res-dom .dbar > i.ok { background: var(--pass); }
.res-dom .dbar > i.no { background: var(--fail); }
.res-dom .dbar { position: relative; }
.res-dom .dbar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 65%; width: 2px; background: var(--ink); opacity: .5; }
.focus-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Mode panels and fast study */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; padding-bottom: 28px; }
.panel { display: grid; gap: 14px; align-content: start; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
.panel h2 { font: 700 23px/1.15 var(--font-display); letter-spacing: -.01em; }
.panel .seg-opts { grid-template-columns: 1fr; }
.panel .seg-opt { padding: 11px 14px; }
.panel-tag { justify-self: start; font: 600 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.resume h3 { font: 700 17px/1.2 var(--font-display); }
.field, .fast-filter { display: grid; gap: 6px; min-width: 0; }
.field select, .fast-filter select { width: 100%; font: 15px/1.3 var(--font-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.fast-top { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; justify-content: space-between; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.fast-filter { flex: 1 1 260px; max-width: 440px; }
.fast-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.kbd-hint { font: 500 12px/1.4 var(--font-mono); color: var(--muted); align-self: center; }
.fact-btn { color: var(--ink); cursor: pointer; border-color: var(--accent); }
.fact-btn:hover:not(:disabled) { background: var(--accent-soft); }
.fact-btn.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fact-btn.is-on b { color: var(--accent-ink); }

  topic: 'Selecting the optimal incremental strategy based on a dataset\'s characteristics',
  stem: `Match each dataset to the most appropriate incremental strategy.`,
  left: [
    `Append-only clickstream; rows are never updated and duplicates are handled downstream`,
    `Customer table where existing rows change; reliable unique key; moderate size`,
    `BigQuery table partitioned by date where whole days are reprocessed each run`,
    `Multi-terabyte event table; you want to process, retry, and backfill independent daily batches`,
    `Rows keyed by a column that isn't truly unique; replace all rows for the keys present in the new data`
  ],
  right: [
    `append`,
    `merge`,
    `insert_overwrite`,
    `microbatch`,
    `delete+insert`
  ],
  answer: [0, 1, 2, 3, 4],
  exp: [
    `• **append**: only inserts, with no duplicate check. It is the cheapest.`,
    `• **merge**: upserts by ~unique_key~ (updates existing rows, inserts new ones). It can get expensive on huge tables; without ~unique_key~ it behaves like append.`,
    `• **insert_overwrite**: replaces whole partitions. Ideal for partitioned tables, such as date-partitioned tables on BigQuery.`,
    `• **microbatch**: processes time batches (~event_time~, ~batch_size~), with backfill and retry per batch.`,
    `• **delete+insert**: deletes the rows for the keys present and reinserts them. Useful when the key is not truly unique or when merge is not supported.`
  ],

      lang: 'sql',
      label: 'models/fct_sessions.sql',
      text: `

        materialized='incremental',
        incremental_strategy='microbatch',

        batch_size='day'

{

  stem: `Which statement about the microbatch incremental strategy is correct?`,
  options: [
    `You write the model query to process a single batch, and dbt automatically filters upstream refs that have ~event_time~ configured.`,
    `The model must wrap its filter in ~{% if is_incremental() %}~ so dbt knows which rows belong to each batch.`,
    `The default ~lookback~ is 0, so late-arriving data is never reprocessed unless configured.`,
    `You can backfill with ~--event-time-start~ alone; dbt uses the current time as the end.`
  ],
  answer: 0,
  exp: [
    `Microbatch requires ~event_time~, ~batch_size~ (~hour~, ~day~, ~month~ or ~year~) and ~begin~. The default ~lookback~ is **1** (it reprocesses one previous batch to catch late-arriving data). It doesn't need ~is_incremental()~.`,
    `For a backfill, ~--event-time-start~ and ~--event-time-end~ are required together. Upstream models without ~event_time~ are read in full in every batch. All times are treated as UTC.`

},

{
  id: 'd4-clone-ci', d: 'd4', type: 'mc',
  topic: 'Using dbt clone',
  stem: `On Snowflake, your CI job runs ~dbt build --select state:modified+ --defer --state prod-artifacts~. Modified incremental models are always built from scratch in the CI schema, which is slow and expensive. What is the recommended improvement?`,
  options: [
    `Add ~--full-refresh~ to the CI job.`,
    `Before the build, run ~dbt clone --select state:modified+,config.materialized:incremental,state:old --state prod-artifacts~.`,
    `Change the incremental models to ~table~ only in CI.`,
    `Remove ~--defer~ so CI reads the incremental models directly from production.`
  ],
  answer: 1,
  exp: [
    `Recommended practice (*Clone incremental models*): as the first CI step, clone (zero-copy) the modified incremental models that already exist in production (~state:old~). Then ~dbt build~ runs incrementally on top of the clone, instead of rebuilding the whole history.`,
    `• ~--full-refresh~ would do exactly the opposite.`,
    `• ~--defer~ resolves refs to unbuilt nodes against production, but doesn't create objects; without it, unmodified parents wouldn't be found in the CI schema.`
  ],
  doc: 'https://docs.getdbt.com/best-practices/clone-incremental-models'
},
{
  id: 'd4-clone-domc', d: 'd4', type: 'domc',
  topic: 'Using dbt clone',
  stem: `Which statement about ~dbt clone~ is correct?`,
  options: [
    `On platforms without zero-copy cloning, ~dbt clone~ creates views that select from the relations in the provided state.`,
    `By default, ~dbt clone~ replaces relations that already exist in the target schema.`,
    `~dbt clone~ works without any state artifacts, because it reads production relations directly.`,
    `~dbt clone~ is always cheaper than ~--defer~, because deferral copies data into the development schema.`
  ],
  answer: 0,
  exp: [
    `~dbt clone --state <artifacts>~ clones the selected nodes from the given state into the target. With zero-copy (Snowflake, Databricks, BigQuery), it creates clones; without that support, it creates *pointer views* (~select * from~ the source object).`,
    `By default it does **not** recreate relations that already exist; use ~--full-refresh~ for that. ~--defer~ creates no objects and is usually cheaper. Clone creates real objects, which is useful for testing in BI tools, for blue/green deployments and for CI with incremental models.`
  ],
  doc: 'https://docs.getdbt.com/reference/commands/clone'
},

    `A Python model that detects the warehouse at run time`,
    `A separate copy of the package for each warehouse`
  ],
  answer: 0,
  exp: [
    `~adapter.dispatch~ picks the implementation for the adapter in use: it looks for ~<adapter>__name~ (such as ~bigquery__date_diff_days~) and falls back to ~default__name~ when there is no specific one. Models call a single macro, and the difference lives in one place.`,

{
  id: 'cp-d1-dry-intermediate', d: 'd1', type: 'mc', set: 'cp1',
  topic: 'Conceptualizing modularity and how to incorporate DRY principles',
  stem: `Three marts each start with the same 40-line CTE that joins ~stg_orders~ to ~stg_payments~ and computes order totals. What is the most modular way to remove the duplication?`,
  options: [
    `Move the logic into an intermediate model, such as ~int_order_totals~, and ~ref()~ it from the three marts.`,
    `Wrap the 40 lines in a macro and call it inside each mart's CTE.`,
    `Move the join into ~stg_orders~, so every mart already gets it.`,
    `Keep the duplication, because marts should never depend on other models.`
  ],
  answer: 0,
  exp: [
    `When the repeated logic produces a **dataset**, it belongs in a model: it is computed once, appears in the DAG, can be tested and documented, and the marts just use ~ref()~.`,
    `Macros are for reusable, parameterized SQL snippets, such as conversions. With a macro, the join would run three times and be invisible in the DAG. And staging should be 1:1 with the source, with no joins.`

  doc: 'https://docs.getdbt.com/best-practices/how-we-structure/3-intermediate'
},
{
  id: 'cp-d1-mat-table', d: 'd1', type: 'mc', set: 'cp1',
  topic: 'Understanding core dbt materializations',
  stem: `~fct_daily_sales~ is a view with heavy joins over 500 million rows. A dashboard queries it dozens of times per hour, and every query is slow. The data only changes once a day, after the nightly ~dbt build~. What is the best materialization change?`,
  options: [
    `Materialize it as a ~table~, so the joins run once per build instead of on every dashboard query.`,
    `Make it ~ephemeral~, so the dashboard reads it as a CTE.`,
    `Keep the view and give the nightly job more threads.`,
    `Materialize it as ~incremental~ with ~append~, so the dashboard always gets the newest rows.`
  ],
  answer: 0,
  exp: [
    `A view recomputes the query every time someone reads it. Since the data only changes once a day, a ~table~ does the heavy work once at build time and keeps reads fast.`,
    `Ephemeral models don't exist in the warehouse, so the dashboard couldn't even read them. Threads speed up the build, not the dashboard's queries. And ~append~ without a key can duplicate rows; incremental would only pay off if the table became too expensive to rebuild.`
  ],
  doc: 'https://docs.getdbt.com/docs/build/materializations'
},
{
  id: 'cp-d1-mat-ephemeral', d: 'd1', type: 'fill', set: 'cp1',
  topic: 'Understanding core dbt materializations',
  stem: `Complete the blank. A model with ~materialized='______'~ is never created in the warehouse: dbt inserts its SQL as a CTE into every model that refs it.`,
  accept: [
    `ephemeral`
  ],
  exp: [
    `~ephemeral~ models don't become a table or a view: dbt injects their SQL as a CTE into each model that calls ~ref()~ on them. They are meant for light logic used by a few models.`,
    `Since they don't exist in the warehouse, you can't query them directly, and using them in many models repeats the same computation in each one.`
  ],
  doc: 'https://docs.getdbt.com/docs/build/materializations'
},
{
  id: 'cp-d1-snap-hotspot', d: 'd1', type: 'hotspot', set: 'cp1',
  topic: 'Creating snapshots in YAML',
  stem: `The ~orders~ table is fully reloaded every night, which refreshes ~_loaded_at~ on every row. Its ~updated_at~ column only changes when an order really changes. The snapshot below records a new version of **every** order on every run. Click the line that causes it.`,

      - name: orders_snapshot

{
  id: 'cp-d1-empty-hardcoded', d: 'd1', type: 'mc', set: 'cp1',
  topic: 'Validating model logic and schema definitions in dry-runs using the --empty flag',
  stem: `You run ~dbt build --empty~ to validate a large refactor cheaply. One model still runs for 20 minutes and scans a 2 TB table. Its SQL reads ~raw.events.page_views~ directly, without ~source()~. Why wasn't it limited?`,
  options: [
    `~--empty~ only limits ~ref()~ and ~source()~ calls; tables named directly in the SQL are queried normally.`,
    `~--empty~ skips the limit for tables larger than 1 TB.`,
    `~--empty~ only applies to ~dbt run~, not to ~dbt build~.`,
    `The warehouse ignores ~limit 0~ on large tables.`
  ],
  answer: 0,
  exp: [
    `With ~--empty~, dbt rewrites each ~ref()~ and ~source()~ to return zero rows, which validates SQL, dependencies and schema without processing data. A table written directly in the SQL doesn't go through this rewrite and is read in full.`,
    `That is one more reason to declare every raw table as a source. ~--empty~ works with both ~dbt run~ and ~dbt build~.`
  ],
  doc: 'https://docs.getdbt.com/docs/build/empty-flag'
},
{

  stem: `An incremental model uses ~incremental_strategy='merge'~ but has no ~unique_key~. Each run reprocesses the last 3 days of orders, and analysts now see duplicate ~order_id~ values. Why?`,
  options: [

    `~merge~ needs ~on_schema_change: sync_all_columns~ to deduplicate.`
  ],

  exp: [
    `~merge~ uses the ~unique_key~ to decide what to update. Without it, it behaves like ~append~: it inserts everything again and doesn't check for duplicates. Reprocessing a window of days without a key produces repeated rows.`,
    `The fix is to set ~unique_key='order_id'~. ~on_schema_change~ handles new columns, not duplicates.`
  ],
  doc: 'https://docs.getdbt.com/docs/build/incremental-strategy'
},

<script>
(() => {
  'use strict';
  const DOMAINS = window.DBT_DOMAINS;
  const Q = window.DBT_Q;
  const DOM = Object.fromEntries(DOMAINS.map(d => [d.id, d]));
  const byId = Object.fromEntries(Q.map(q => [q.id, q]));
  const LETTERS = 'ABCDEFGH';
  const KEY = { sim: 'dbt-ae-simulado-v1', fast: 'dbt-ae-fast-v1', hist: 'dbt-ae-hist-v1', prefs: 'dbt-ae-simulado-prefs', fastSeen: 'dbt-ae-fastseen-v1',
                simLog: 'dbt-ae-simlog-v1', simDel: 'dbt-ae-simdel-v1' };
  const EXAM_MIN = 120, EXAM_LEN = 65, PASS_PCT = 65;
  const SIM_QUOTA = { d1: 26, d2: 7, d3: 9, d4: 5, d5: 10, d6: 4, d7: 4 };
  const INSTANT = { mc: true, hotspot: true };
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const TYPE_INFO = {
    mc:      { label: () => 'Multiple choice', desc: 'One correct option.', hint: () => 'Select one option.' },
    multi:   { label: q => `Multiple choice · choose ${q.choose}`, desc: 'Choose N correct options.', hint: q => `Select exactly ${q.choose} options.` },
    domc:    { label: () => 'DOMC', desc: 'Options shown one at a time; you answer Yes or No to each.', hint: () => 'Options appear one at a time. The question ends when you answer Yes or when you reject the correct option.' },
    match:   { label: () => 'Matching', desc: 'Match items from two columns.', hint: () => 'Match each item to an option.' },
    order:   { label: () => 'Build list', desc: 'Put steps in the right order.', hint: () => 'Tap the items in the correct order. Tap an item in your list to put it back.' },
    fill:    { label: () => 'Fill in the blank', desc: 'Type the missing term.', hint: () => 'Type the exact term that fills the blank.' },
    hotspot: { label: () => 'Hotspot', desc: 'Click the exact spot in the code.', hint: () => 'Click the line in the code.' }
  };

  let S = null;      // simulado session
  let F = null;      // fast study session
  let H = {};        // per-question history: { id: { n, c, last, t } }
  let FS = {};       // times each question was shown in fast study (answered or skipped)
  let view = 'start';
  let confirmFinish = false, confirmDiscard = false, confirmReset = false;
  let openTopics = false, openFormats = false;   // breakdown panels on the start screen
  let prefs = { mode: 'study', order: 'mixed', fastDomain: 'all' };
  let RV = null;     // past simulado opened from the history (read-only)
  let SL = [];       // finished simulados, newest first; mirrored to the account's db when the page can reach it
  let DEL = [];      // ids of simulados deleted from the history (so other devices drop them too)
  let DB = null, syncState = 'off';   // off | syncing | on | local | error
  const PUB = !!window.DBT_PUBLIC;    // public build: browser storage only, no personal checkpoint
  let resFilter = 'all', confirmDel = null, confirmP2 = false;

  /* ── storage ── */
  function load(key) { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function store(key, val) { try { if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  const saveSim = () => store(KEY.sim, S);
  const saveFast = () => store(KEY.fast, F);
  const saveHist = () => store(KEY.hist, H);
  const savePrefs = () => store(KEY.prefs, prefs);
  const saveFS = () => store(KEY.fastSeen, FS);
  const saveSL = () => store(KEY.simLog, SL);
  const saveDEL = () => store(KEY.simDel, DEL);

  /* ── helpers ── */
  const $ = sel => document.querySelector(sel);
  // replaceChildren() turns null and arrays into text ("null", "[object HTMLElement]"), so flatten and drop empties first
  function setChildren(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter(c => c != null && c !== false)); }
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function md(s) { return esc(s).replace(/~([^~]+)~/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>'); }
  function plain(s) { return String(s).replace(/~/g, '').replace(/\*\*/g, ''); }
  function dedent(t) {
    const lines = String(t).replace(/^\n/, '').replace(/\s+$/, '').split('\n');
    const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
    return lines.map(l => l.slice(Number.isFinite(ind) ? ind : 0)).join('\n');
  }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function range(n) { return Array.from({ length: n }, (_, i) => i); }
  function shuffledNotIdentity(n) { if (n < 2) return range(n); let p; do { p = shuffle(range(n)); } while (p.every((v, i) => v === i)); return p; }
  function fmtTime(ms) { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; }
  function scrollTop() { window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); }
  function activeKey() { const a = document.activeElement; return a && a.dataset ? a.dataset.fk : null; }
  function restoreFocus(root, key) { if (!key) return; const el = root.querySelector(`[data-fk="${key}"]`); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  function fmtDate(t) {
    if (!t) return 'unknown date';
    const d = new Date(t), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function excerpt(s, n) {
    const t = plain(s).replace(/\s+/g, ' ').trim();
    if (t.length <= n) return t;
    const cut = t.slice(0, n);
    return cut.slice(0, Math.max(cut.lastIndexOf(' '), n - 20)) + '…';
  }

  /* ── syntax colouring for code blocks ── */
  const RX = {
    sql: /(\{\{.*?\}\}|\{%.*?%\})|(--.*$)|('[^']*')/g,
    yaml: /(\{\{.*?\}\}|\{%.*?%\})|(#.*$)|('[^']*'|"[^"]*")/g,
    bash: /(\{\{.*?\}\})|(#.*$)|('[^']*'|"[^"]*")/g
  };
  function hlTokens(s, lang) {
    const re = new RegExp(RX[lang].source, 'g');
    let out = '', last = 0, m;
    while ((m = re.exec(s))) {
      if (m[0] === '') { re.lastIndex++; continue; }
      out += esc(s.slice(last, m.index));
      const cls = m[1] ? 't-jinja' : m[2] ? 't-com' : 't-str';
      out += `<span class="${cls}">${esc(m[0])}</span>`;
      last = re.lastIndex;
    }
    return out + esc(s.slice(last));
  }
  function hl(line, lang) {
    if (lang === 'log') {
      return esc(line)
        .replace(/\[(PASS|OK)([^\]]*)\]/g, '<span class="t-pass">[$1$2]</span>')
        .replace(/\[(FAIL|ERROR)([^\]]*)\]/g, '<span class="t-fail">[$1$2]</span>')
        .replace(/\[(WARN)([^\]]*)\]/g, '<span class="t-warn">[$1$2]</span>')
        .replace(/\[(SKIP|RUN)\]/g, '<span class="t-muted">[$1]</span>');
    }
    if (!RX[lang]) return esc(line);
    if (lang === 'yaml') {
      const m = line.match(/^(\s*(?:-\s+)?)([A-Za-z_+][\w.+-]*)(:)(.*)$/);
      if (m) return esc(m[1]) + `<span class="t-key">${esc(m[2])}</span>:` + hlTokens(m[4], lang);
    }
    return hlTokens(line, lang);
  }
  function codeBlock(c, hot) {
    const lines = dedent(c.text).split('\n');
    const nums = c.lang !== 'log';
    const body = h('div', { class: 'code-body' });
    lines.forEach((ln, i) => {
      const inner = (nums ? `<span class="ln">${i + 1}</span>` : '') + `<span class="lc">${hl(ln, c.lang) || ' '}</span>`;
      if (hot) {
        let st = '';
        if (hot.fb) { if (i === hot.answer) st = ' is-correct'; else if (i === hot.sel) st = ' is-wrong'; }
        else if (i === hot.sel) st = ' is-sel';
        body.append(h('button', { type: 'button', class: 'cl hl-btn' + st, disabled: hot.locked, 'aria-pressed': String(i === hot.sel), 'data-fk': `l${i}`, onclick: () => hot.pick(i), html: inner }));
      } else {
        body.append(h('div', { class: 'cl', html: inner }));
      }
    });
    return h('figure', { class: 'code' }, c.label ? h('figcaption', {}, c.label) : null, body);
  }

  /* ── grading ── */
  function norm(s) { return String(s || '').toLowerCase().trim().replace(/[`'"~]/g, '').replace(/[\s-]+/g, '_'); }
  function isComplete(q, r) {
    if (r == null) return false;
    switch (q.type) {
      case 'mc': case 'hotspot': return typeof r === 'number';
      case 'multi': return Array.isArray(r) && r.length === q.choose;
      case 'domc': return !!r.done;
      case 'match': return Array.isArray(r) && r.length === q.left.length && r.every(v => v != null);
      case 'order': return Array.isArray(r) && r.length === q.items.length;
      case 'fill': return String(r).trim().length > 0;
    }
    return false;
  }
  function grade(q, r) {
    if (!isComplete(q, r)) return false;
    switch (q.type) {
      case 'mc': case 'hotspot': return r === q.answer;
      case 'multi': { const a = r.slice().sort(), b = q.answers.slice().sort(); return a.length === b.length && a.every((v, i) => v === b[i]); }
      case 'domc': return r.correct === true;
      case 'match': return q.answer.every((v, i) => r[i] === v);
      case 'order': return r.every((v, i) => v === i);
      case 'fill': return q.accept.some(a => norm(a) === norm(r));
    }
    return false;
  }
  function domcStep(q, perm, prev, yes) {
    prev = prev || { said: [] };
    if (prev.done) return prev;
    const r = { said: prev.said.concat(yes) };
    const oi = perm[r.said.length - 1];
    if (yes) { r.done = true; r.correct = oi === q.answer; }
    else if (oi === q.answer) { r.done = true; r.correct = false; }
    else if (r.said.length >= perm.length) { r.done = true; r.correct = false; }
    return r;
  }
  function makePerm(q) {
    if (q.type === 'mc' || q.type === 'multi' || q.type === 'domc') return shuffle(range(q.options.length));
    if (q.type === 'match') return shuffle(range(q.right.length));
    if (q.type === 'order') return shuffledNotIdentity(q.items.length);
    return null;
  }
  // Option order saved with a session; falls back to the bank order if the question changed since
  function safePerm(q, p) {
    if (q.type === 'fill' || q.type === 'hotspot') return null;
    const n = q.type === 'match' ? q.right.length : q.type === 'order' ? q.items.length : q.options.length;
    return Array.isArray(p) && p.length === n && range(n).every(i => p.includes(i)) ? p : range(n);
  }
  // The quiz and results screens show the live simulado (S) or a past one opened from the history (RV)
  const cur = () => RV || S;
  // P correct · F wrong · S unanswered · U unknown (reconstructed simulado with no result for that question)
  function outcome(X, id) {
    if (X.recon) { const v = X.recon[id]; return v === true ? 'P' : v === false ? 'F' : 'U'; }
    const q = byId[id], r = X.resp[id];
    return !isComplete(q, r) ? 'S' : grade(q, r) ? 'P' : 'F';
  }

  /* ── history ── */
  function record(id, ok) {
    const x = H[id] || { n: 0, c: 0 };
    H[id] = { n: x.n + 1, c: x.c + (ok ? 1 : 0), last: !!ok, t: Date.now() };
    saveHist();
  }
  function histStats(ids) {
    ids = ids || Q.map(q => q.id);
    let seen = 0, lastOk = 0, pending = 0;
    ids.forEach(id => { const x = H[id]; if (!x) return; seen++; if (x.last) lastOk++; else pending++; });
    return { seen, lastOk, pending, total: ids.length, acc: seen ? pct(lastOk, seen) : null };
  }
  // Questions from a reserved set (the checkpoint batch) stay out of fast study until answered somewhere
  // Questions of a fixed exam (Prova 2) also stay out of fast study and of the random draw until answered in that exam
  const reserved = q => (PUB ? !!q.exam : (!!q.set || !!q.exam)) && !H[q.id];
  const P2 = Q.filter(q => q.exam === 'p2').map(q => q.id);

  /* ── answer renderers; ctx = { id, q, r, perm, locked, fb, set, input, submit, domc } ── */
  function optContent(q, oi) {
    if (q.codeOptions) return h('pre', { class: 'opt-code', html: dedent(q.options[oi]).split('\n').map(l => hl(l, 'yaml')).join('\n') });
    return h('span', { html: md(q.options[oi]) });
  }
  function toggleMulti(ctx, oi) {

  /* ── simulado history: every finished simulado, with all questions and answers ── */

  // The checkpoint simulado was taken before this history existed. If no record of it is left, rebuild which

  function reconstructCheckpoint() {
    const cp = Q.filter(q => q.set === 'cp1').map(q => q.id);
    if (!cp.length || !cp.every(id => H[id] && typeof H[id].t === 'number')) return;
    const cpSet = new Set(cp);
    if (SL.some(r => r.ids.filter(id => cpSet.has(id)).length >= cp.length - 5)) return;
    const T = Math.min(...cp.map(id => H[id].t));
    if (cp.filter(id => H[id].t - T < 3000).length < 5) return;   // not answered together, so not an exam-mode simulado
    const id = 'cp1-' + T.toString(36);
    if (DEL.includes(id)) return;
    const wrong = S && S.mode === 'study' && S.startedAt > T && S.ids.length < cp.length && S.ids.every(x => cpSet.has(x)) ? new Set(S.ids) : null;
    const recon = {};
    cp.forEach(x => {
      const hx = H[x];
      recon[x] = wrong ? !wrong.has(x) : hx.n === 1 ? hx.c === 1 : hx.c === 0 ? false : hx.c === hx.n ? true : null;
    });
    const rec = { v: 1, id, mode: 'exam', order: 'domain', kind: 'full', recon, startedAt: null, finishedAt: T,
      ids: domainSort(cp.slice()), resp: {}, perms: {}, flags: {} };

    if (!(window.claude && typeof window.claude.use === 'function')) { syncState = 'off'; return; }

    if (!db) { syncState = 'off'; refreshHistory(); return; }
    try {
      const snap = await withTimeout(db.collection('sims').get(), 10000);
      DB = db;
      const remote = {};
      snap.docs.forEach(d => { if (d.exists) remote[d.id] = d.data(); });
      let changed = false;
      Object.keys(remote).forEach(id => {
        const d = remote[id];
        if (d && d.deleted) {   // deleted on another device
          if (!DEL.includes(id)) { DEL.push(id); changed = true; }
          if (SL.some(r => r.id === id)) { SL = SL.filter(r => r.id !== id); changed = true; }
        } else if (validRecord(d) && !DEL.includes(id) && !SL.some(r => r.id === id)) {   // taken on another device
          SL.push(JSON.parse(JSON.stringify(d))); changed = true;
        }
      });
      if (changed) { sortSL(); saveSL(); saveDEL(); }

  /* ── fast study ── */
  const LOG_MAX = 500;   // past questions kept for going back

  }
  const wrongIds = () => Q.filter(q => H[q.id] && H[q.id].last === false).map(q => q.id);
  function fastPool() {
    if (F.domain === 'wrong') return wrongIds();

  }
  // Deck-style draw: a question already shown in fast study only comes back after every
  // other question in the filter has been shown as many times. Within the least-shown tier,
  // questions never answered anywhere come first, then ones last answered wrong.
  function pickNext() {
    let pool = fastPool();
    if (!pool.length) { F.domain = 'all'; prefs.fastDomain = 'all'; savePrefs(); pool = fastPool(); }
    const recent = new Set(F.recent.slice(-Math.min(10, Math.max(0, pool.length - 1))));
    let cands = pool.filter(id => id !== F.id && !recent.has(id));
    if (!cands.length) cands = pool.filter(id => id !== F.id);
    if (!cands.length) cands = pool;
    const least = Math.min(...cands.map(id => FS[id] || 0));
    const tier = cands.filter(id => (FS[id] || 0) === least);
    const w = tier.map(id => { const x = H[id]; if (!x) return 3; return x.last ? 1 : 2; });
    let t = Math.random() * w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < tier.length; i++) { t -= w[i]; if (t <= 0) return tier[i]; }
    return tier[tier.length - 1];
  }
  function drawFast() {

  }

      nReserved ? h('p', { class: 'note' }, `The ${nReserved} new checkpoint questions stay out of fast study until you answer them in a practice exam.`) : null,
      nP2Pending ? h('p', { class: 'note' }, `The ${nP2Pending} Exam 2 questions you haven't answered yet stay out of fast study and the random practice exam.`) : null,
      h('label', { class: 'field', for: 'start-fast-domain' }, h('span', { class: 'ord-h' }, 'Filter'),
        h('select', { id: 'start-fast-domain', 'data-fk': 'start-fast-domain', onchange: e => { prefs.fastDomain = e.target.value; savePrefs(); } }, domainOptions(prefs.fastDomain))),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn btn-primary', 'data-fk': 'fast-go', onclick: startFast }, F && F.n ? `Continue session (${F.n} answered)` : 'Start fast study'),
        F && F.n ? h('button', { type: 'button', class: 'btn', onclick: () => { newFast(prefs.fastDomain); view = 'fast'; render(); scrollTop(); } }, 'New session') : null));

    /* simulado panel */
    let resume = null;
    if (S && !S.finished) {
      const answered = S.ids.filter(id => isComplete(byId[id], S.resp[id])).length;
      resume = h('div', { class: 'resume' },
        h('h3', {}, S.kind === 'p2' ? 'Exam 2 in progress' : 'Practice exam in progress'),
        h('p', { class: 'note' }, `${S.mode === 'exam' ? 'Exam' : 'Study'} mode · ${answered} of ${S.ids.length} answered` + (S.mode === 'exam' ? ` · ${fmtTime(S.deadline - Date.now())} left` : '')),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn btn-primary', onclick: () => { view = 'quiz'; render(); scrollTop(); } }, 'Pick up where I left off'),
          confirmDiscard
            ? h('button', { type: 'button', class: 'btn', onclick: () => { S = null; store(KEY.sim, null); confirmDiscard = false; renderStart(); } }, 'Confirm: discard')
            : h('button', { type: 'button', class: 'btn', onclick: () => { confirmDiscard = true; renderStart(); } }, 'Discard')));
    } else if (S && S.finished) {
      const ok = S.ids.filter(id => grade(byId[id], S.resp[id])).length;
      resume = h('div', { class: 'resume' },
        h('h3', {}, 'Latest result'),
        h('p', { class: 'note' }, `${ok} of ${S.ids.length} correct (${pct(ok, S.ids.length)}%).`),
        h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn', onclick: () => { view = 'results'; render(); scrollTop(); } }, 'See results and review')));
    }
    const simPanel = h('section', { class: 'panel' },
      h('span', { class: 'panel-tag' }, 'Exam day'),
      h('h2', {}, `${simTotal}-question practice exam`),
      h('p', { class: 'note' }, `Draws ${simTotal} questions from the bank following the weight of each domain, prioritizing the ones you haven't seen yet. Every finished practice exam goes into the history below.`),
      nReserved ? h('p', { class: 'reserved', html: `<strong>${nReserved} new questions reserved for the checkpoint.</strong> The next random practice exam uses these before any other.` +
        (prefs.mode === 'exam' ? ' Exam mode is already selected.' : ' To count as the checkpoint, choose Exam mode below.') }) : null,
      resume,
      radioGroup('mode', 'Mode', [
        { v: 'study', t: 'Study', d: 'Grading and explanation after each answer.' },
        { v: 'exam', t: 'Exam', d: '2-hour timer; grading only at the end.' }
      ], prefs.mode, v => setPref('mode', v)),
      radioGroup('order', 'Question order', [
        { v: 'mixed', t: 'Mixed', d: 'Domains shuffled, as in the real exam.' },
        { v: 'domain', t: 'By domain', d: 'From the most to the least heavily weighted domain.' }
      ], prefs.order, v => setPref('order', v)),
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'btn btn-primary', 'data-fk': 'sim-go', onclick: () => { newSession(prefs.mode, prefs.order); view = 'quiz'; render(); scrollTop(); } }, S && !S.finished ? 'Draw a new practice exam' : 'Draw a practice exam')));

    /* Prova 2: fixed exam calibrated to the real one */
    let p2Panel = null;
    if (P2.length) {
      const last = SL.find(r => r.kind === 'p2');
      const lastSum = last && summarize(last);
      const busy = S && !S.finished;
      const startP2 = () => { confirmP2 = false; newSession('exam', 'mixed', P2, 'p2'); view = 'quiz'; render(); scrollTop(); };
      p2Panel = h('section', { class: 'panel panel-wide' },
        h('span', { class: 'panel-tag' }, 'Harder than the real exam'),
        h('h2', {}, 'Exam 2'),
        h('p', { class: 'note' }, `${P2.length} fixed, unseen questions in exam mode with a 2-hour timer. The distractors are plausible, most questions include YAML, SQL, a command or a log, and the domain and subtopic only appear in the review. It is harder than the official exam on purpose: scoring above 65% here is a good sign.` + (PUB ? ' Take it after studying with the bank, because these questions stay out of fast study and the random practice exam.' : '')),
        last ? h('p', { class: 'reserved' }, h('strong', {}, `Latest attempt: ${lastSum.pct}% `), `(${lastSum.pass}/${lastSum.n}) on ${fmtDate(last.startedAt || last.finishedAt)}. A retake measures retention, not performance on new questions.`) : null,
        h('div', { class: 'row' }, confirmP2
          ? [h('button', { type: 'button', class: 'btn btn-primary', 'data-fk': 'p2-yes', onclick: startP2 }, 'Confirm: discard the practice exam in progress'),
             h('button', { type: 'button', class: 'btn', 'data-fk': 'p2-no', onclick: () => { confirmP2 = false; renderStart(); } }, 'Cancel')]
          : h('button', { type: 'button', class: 'btn btn-primary', 'data-fk': 'p2-go', onclick: () => { if (busy) { confirmP2 = true; renderStart(); } else startP2(); } }, last ? 'Retake Exam 2' : 'Start Exam 2')));
    }

    setChildren(root,
      h('div', { class: 'hero' },
        PUB ? h('p', { class: 'lang-switch' }, h('a', { href: 'pt/index.html', hreflang: 'pt-BR', lang: 'pt-BR' }, 'Versão em português →')) : null,
        h('p', { class: 'eyebrow' }, (PUB ? 'Unofficial · ' : '') + 'dbt Analytics Engineering Certification · dbt Core 1.11'),
        h('h1', {}, 'dbt Analytics Engineering Practice Exam'),
        h('p', { class: 'lede' }, `A bank of ${Q.length} questions in the exam format, distributed by the weight of each domain in the official study guide. Every explanation links to the documentation.`),
        h('div', { class: 'facts' },
          h('span', { class: 'fact' }, h('b', {}, String(Q.length)), ' questions in the bank'),
          h('span', { class: 'fact' }, h('b', {}, '65'), ' on the exam, in 2 h'),
          h('span', { class: 'fact' }, h('b', {}, '65%'), ' to pass'),
          h('span', { class: 'fact' }, h('b', {}, '7'), ' formats'))),
      h('div', { class: 'modes' }, fastPanel, simPanel, p2Panel),
      history,
      progress,
      h('div', { class: 'block' },
        h('h2', {}, 'Distribution by domain'),
        h('p', { class: 'note' }, 'The official guide publishes no percentages per domain. The number of questions follows the number of subtopics in each domain in the Topics Outline, with extra weight on Tests, which appear in 3 of the 10 sample questions.'),
        h('div', { class: 'dist' }, dist.map(d => h('div', { class: 'drow' },
          h('div', { class: 'dname' }, h('span', { class: 'dnum' }, `D${d.n}`), h('span', {}, d.en)),
          h('div', { class: 'dval' }, `${bankCount(d)} in the bank · ${SIM_QUOTA[d.id]} per practice exam · ${pct(bankCount(d), Q.length)}%`),
          h('div', { class: 'dbar' }, h('i', { style: `width:${bankCount(d) / maxBank * 100}%` })))))),
      h('div', { class: 'block' },
        h('h2', {}, 'Question formats'),
        h('div', { class: 'formats' }, fmtOrder.filter(t => fmtCounts[t]).map(t => h('div', { class: 'fmt' },
          h('div', { class: 'fmt-h' }, h('span', {}, TYPE_INFO[t].label({ choose: 'N' })), h('span', {}, String(fmtCounts[t]))),
          h('p', {}, TYPE_INFO[t].desc))))),
      PUB ? h('div', { class: 'block' },
        h('h2', {}, 'About this practice exam'),
        h('p', { class: 'note' }, 'An independent, free project, not affiliated with dbt Labs. The questions are original, written with AI assistance (Claude) from the official study guide and the dbt Core 1.11 documentation. None of them reproduces exam questions.'),
        h('p', { class: 'note' }, 'There may be mistakes. Every explanation links to the documentation: when in doubt, the documentation wins.'),
        h('p', { class: 'note' }, 'Your progress and practice exam history are saved only in this browser. Nothing is sent to any server.')) : null);
    restoreFocus(root, key);
  }

  /* ── results screen ── */
  function renderResults() {
    const key = activeKey();
    const X = cur(), root = $('#screen-results'), past = X === RV;
    const sum = summarize(X), n = sum.n;
    const ok = sum.pct >= PASS_PCT;
    const doms = DOMAINS.filter(d => sum.per[d.id]).map(d => Object.assign({}, d, sum.per[d.id], { pct: pct(sum.per[d.id].c, sum.per[d.id].t) }))
      .sort((a, b) => b.t - a.t || a.n - b.n);
    const weak = doms.filter(d => d.pct < PASS_PCT).sort((a, b) => (b.t * (PASS_PCT - b.pct)) - (a.t * (PASS_PCT - a.pct)));
    const st = {};
    X.ids.forEach(id => { st[id] = outcome(X, id); });
    const wrongIds = X.ids.filter(id => st[id] === 'F' || st[id] === 'S');
    const elapsed = X.finishedAt && X.startedAt ? fmtTime(X.finishedAt - X.startedAt) : null;
    const busy = past && S && !S.finished;   // a redo would replace the simulado in progress
    const redo = () => { RV = null; newSession('study', 'mixed', wrongIds); view = 'quiz'; render(); scrollTop(); };
    const back = () => {
      view = 'start'; render();
      const el = past && document.getElementById('hist');
      if (el) el.scrollIntoView({ block: 'start' }); else scrollTop();
    };
    const filters = [
      { k: 'all', t: 'All', c: n },
      { k: 'F', t: sum.fail === 1 ? 'Wrong' : 'Wrong', c: sum.fail },
      { k: 'P', t: sum.pass === 1 ? 'Right' : 'Right', c: sum.pass },
      sum.skip ? { k: 'S', t: 'Blank', c: sum.skip } : null,
      sum.unknown ? { k: 'U', t: 'No record', c: sum.unknown } : null
    ].filter(Boolean);
    if (!filters.some(f => f.k === resFilter)) resFilter = 'all';
    const shown = X.ids.map((id, i) => ({ id, i })).filter(x => resFilter === 'all' || st[x.id] === resFilter);
    const mark = { P: '✓', F: '✗', S: '–', U: '?' }, markLabel = { P: 'correct', F: 'incorrect', S: 'blank', U: 'no record' };
    const kindLabel = X.recon ? 'rebuilt checkpoint' : X.kind === 'p2' ? 'exam 2' : X.kind === 'redo' ? 'redo wrong answers' : null;

    setChildren(root,
      h('div', { class: 'res-head' },
        h('p', { class: 'eyebrow' }, [past ? 'History' : 'Result', fmtDate(X.startedAt || X.finishedAt), kindLabel, `${X.mode === 'exam' ? 'exam' : 'study'} mode`, elapsed].filter(Boolean).join(' · ')),
        h('h1', {}, ok ? 'Above the passing score' : 'Below the passing score'),
        h('div', { class: 'res-score' }, h('span', { class: 'res-pct' }, `${sum.pct}%`), h('span', { class: 'verdict ' + (ok ? 'ok' : 'no') }, ok ? `Pass (minimum ${PASS_PCT}%)` : `Fail (minimum ${PASS_PCT}%)`)),
        h('div', { class: 'logline', style: 'border-radius:8px' }, 'Done. ', h('span', { class: 't-pass' }, `PASS=${sum.pass}`), ' ', h('span', { class: 't-fail' }, `FAIL=${sum.fail}`), ' ', h('span', { class: 't-muted' }, `SKIP=${sum.skip}`),
          sum.unknown ? h('span', { class: 't-muted' }, ` NO_RECORD=${sum.unknown}`) : null, ` TOTAL=${n}`),
        X.recon ? h('p', { class: 'reserved' }, h('strong', {}, 'Rebuilt practice exam. '),
          'It was taken before the history existed. The app recovered which questions you got right and wrong from your progress in the bank, but not the options you picked or the exam time.') : null,
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn btn-primary', 'data-fk': 'res-review', onclick: () => openReview(0) }, 'Review question by question'),
          wrongIds.length && !busy ? h('button', { type: 'button', class: 'btn', onclick: redo }, `Redo the ${wrongIds.length} I got wrong`) : null,
          h('button', { type: 'button', class: 'btn', onclick: back }, past ? 'Back to history' : 'Back to start')),
        wrongIds.length && busy ? h('p', { class: 'note' }, 'To redo the wrong answers from this practice exam, first finish or discard the practice exam in progress.') : null),
      h('div', { class: 'block res-dom' },
        h('h2', {}, 'Performance by domain'),
        h('p', { class: 'note' }, 'The vertical line marks 65%.'),
        h('div', { class: 'dist' }, doms.map(d => h('div', { class: 'drow' },
          h('div', { class: 'dname' }, h('span', { class: 'dnum' }, `D${d.n}`), h('span', {}, d.en)),
          h('div', { class: 'dval' }, `${d.c}/${d.t} · ${d.pct}%`),
          h('div', { class: 'dbar' }, h('i', { class: d.pct >= PASS_PCT ? 'ok' : 'no', style: `width:${Math.max(d.pct, 2)}%` })))))),
      weak.length ? h('div', { class: 'block' },
        h('h2', {}, 'Where to focus'),
        h('p', { class: 'note' }, 'Domains below 65%, sorted by impact on the score (domain weight × distance to the target). In fast study, filter by one of these domains to practice.'),
        h('ol', { class: 'focus-list' }, weak.map(d => h('li', {}, h('strong', {}, `D${d.n} · ${d.en}`), ` (${d.pct}%, ${d.t} questions in the practice exam)`)))) : null,
      h('div', { class: 'block' },
        h('h2', {}, `All questions (${n})`),
        h('p', { class: 'note' }, X.recon
          ? 'Tap a question to see the full stem, the correct answer and the explanation.'
          : 'Tap a question to see the full stem, your answer, the correct one and the explanation.'),
        h('div', { class: 'qfilter', role: 'group', 'aria-label': 'Filter questions' }, filters.map(f => h('button', {
            type: 'button', class: 'fact fact-btn' + (resFilter === f.k ? ' is-on' : ''), 'aria-pressed': String(resFilter === f.k), 'data-fk': 'qf-' + f.k,
            disabled: !f.c && resFilter !== f.k, onclick: () => { resFilter = f.k; renderResults(); } },
          h('b', {}, String(f.c)), ' ' + f.t))),
        h('div', { class: 'qlist' }, shown.map(({ id, i }) => {
          const q = byId[id], o = st[id];
          return h('button', { type: 'button', class: 'qrow', onclick: () => openReview(i) },
            h('span', { class: 'qrow-n' }, String(i + 1)),
            h('span', { class: 'qrow-st st-' + o, role: 'img', 'aria-label': markLabel[o] }, mark[o]),
            h('span', { class: 'qrow-body' },
              h('span', { class: 'qrow-meta' }, `D${DOM[q.d].n} · ${q.topic}`),
              h('span', { class: 'qrow-stem' }, excerpt(q.stem, 150))));
        }))));
    restoreFocus(root, key);
  }

  /* ── router ── */
  function render() {
    if (view === 'start' || view === 'fast') RV = null;
    if ((view === 'quiz' || view === 'results') && !cur()) view = 'start';
    if (view === 'fast' && !F) view = 'start';
    $('#screen-start').hidden = view !== 'start';
    $('#screen-quiz').hidden = view !== 'quiz';
    $('#screen-fast').hidden = view !== 'fast';
    $('#screen-results').hidden = view !== 'results';
    $('#bar').hidden = view !== 'quiz' && view !== 'fast';
    if (view === 'start') renderStart();
    else if (view === 'quiz') renderQuiz();
    else if (view === 'fast') renderFast();
    else renderResults();
  }

  function onKey(e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    const digit = /^[1-8]$/.test(e.key) ? Number(e.key) - 1 : null;
    const pickByKey = ctx => {
      if (ctx.locked || (ctx.q.type !== 'mc' && ctx.q.type !== 'multi')) return;
      const oi = ctx.perm[digit];
      if (oi == null) return;
      if (ctx.q.type === 'mc') ctx.set(oi); else toggleMulti(ctx, oi);
    };
    if (view === 'quiz') {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(cur().idx + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur().idx - 1); }
      else if (digit !== null) pickByKey(quizCtx());
    } else if (view === 'fast') {
      const cur = fastEntry();
      const fwd = e.key === 'ArrowRight' || (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A' && cur.locked);
      if (e.key === 'ArrowLeft' && F.back < F.log.length) { e.preventDefault(); fastGo(F.back + 1); }
      else if (fwd && F.back) { e.preventDefault(); fastGo(F.back - 1); }
      else if (fwd && cur.locked) { e.preventDefault(); fastNext(); }
      else if (digit !== null) pickByKey(fastCtx());
    }
  }

  function start() {
    const p = load(KEY.prefs); if (p) prefs = Object.assign(prefs, p);
    H = load(KEY.hist) || {};
    FS = load(KEY.fastSeen) || {};
    const savedS = load(KEY.sim);
    if (savedS && savedS.v === 1 && Array.isArray(savedS.ids) && savedS.ids.every(id => byId[id])) S = savedS;
    // simulado history: keep the last finished simulado (taken before the history existed) and rebuild the checkpoint if it is gone
    const savedSL = load(KEY.simLog), savedDEL = load(KEY.simDel);
    DEL = Array.isArray(savedDEL) ? savedDEL.filter(x => typeof x === 'string') : [];
    SL = Array.isArray(savedSL) ? savedSL.filter(validRecord) : [];
    if (S && S.finished) { const rec = sessionRecord(S); if (!DEL.includes(rec.id) && !SL.some(r => r.id === rec.id)) SL.push(rec); }
    if (!PUB) reconstructCheckpoint();
    sortSL(); saveSL();
    const savedF = load(KEY.fast);
    if (savedF && savedF.v === 1) {
      F = savedF;
      F.recent = Array.isArray(F.recent) ? F.recent : [];
      F.log = Array.isArray(F.log) ? F.log.filter(x => x && byId[x.id]) : [];
      F.back = Math.max(0, Math.min(F.log.length, F.back | 0));
      // sessions started before the deck-style draw: count what this session already showed
      if (!Object.keys(FS).length) { F.recent.concat(F.id ? [F.id] : []).forEach(id => { if (byId[id]) FS[id] = (FS[id] || 0) + 1; }); saveFS(); }
      const validDomain = F.domain === 'all' || F.domain === 'wrong' || !!DOM[F.domain];
      if (!validDomain) F.domain = 'all';
      if (!byId[F.id] || !validDomain) { drawFast(); saveFast(); }
    }
    if (prefs.fastDomain !== 'all' && prefs.fastDomain !== 'wrong' && !DOM[prefs.fastDomain]) prefs.fastDomain = 'all';
    view = 'start';
    $('#bar-home').addEventListener('click', () => { view = 'start'; confirmDiscard = false; render(); scrollTop(); });
    document.addEventListener('keydown', onKey);
    setInterval(() => { if (S && view === 'quiz') updateTimer(); }, 1000);
    if (!PUB && window.claude && typeof window.claude.use === 'function') syncState = 'syncing';
    render();
    if (!PUB) initSync();
  }

  start();
})();
</script>
</body>
</html>
