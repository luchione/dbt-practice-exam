<title>Simulado dbt Analytics Engineering</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column under a sticky exam bar; code and feedback rendered as dbt terminal output */
:root {
  --bg: #F2F3F7;
  --surface: #FFFFFF;
  --surface-2: #E9ECF3;
  --ink: #131824;
  --muted: #586174;
  --line: #D6DBE6;
  --accent: #3D35C8;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8E7FB;
  --pass: #157A46;
  --pass-soft: #E1F3E8;
  --fail: #B8352A;
  --fail-soft: #FAE6E3;
  --warn: #9A6200;
  --warn-soft: #FAEFD7;
  --term-bg: #121726;
  --term-ink: #DCE2F0;
  --term-muted: #8590A8;
  --term-line: #222A3D;
  --term-hover: #1B2236;
  --term-sel: #2A2770;
  --term-pass: #133524;
  --term-fail: #3D1A1A;
  --term-jinja: #B9B5FF;
  --term-str: #9FD8B0;
  --term-key: #8EC5FF;
  --term-pass-ink: #5FD69A;
  --term-fail-ink: #FF8C7F;
  --term-warn-ink: #F0BE5C;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1017; --surface: #151922; --surface-2: #1D222E; --ink: #E7EAF2; --muted: #9AA3B6; --line: #2A3141;
    --accent: #A5A1FF; --accent-ink: #12142B; --accent-soft: #24234A;
    --pass: #52C68D; --pass-soft: #13291E; --fail: #FF8072; --fail-soft: #331715; --warn: #E8B04A; --warn-soft: #2E2410;
    --term-bg: #0A0D14; --term-line: #1C2333; --term-hover: #151B2A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1017; --surface: #151922; --surface-2: #1D222E; --ink: #E7EAF2; --muted: #9AA3B6; --line: #2A3141;
  --accent: #A5A1FF; --accent-ink: #12142B; --accent-soft: #24234A;
  --pass: #52C68D; --pass-soft: #13291E; --fail: #FF8072; --fail-soft: #331715; --warn: #E8B04A; --warn-soft: #2E2410;
  --term-bg: #0A0D14; --term-line: #1C2333; --term-hover: #151B2A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); color: var(--ink); padding: .08em .35em; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; }

.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 72px; }

/* Sticky exam bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.brand { border: 0; background: none; padding: 0; color: var(--ink); font: 700 16px/1 var(--font-display); cursor: pointer; letter-spacing: -.01em; }
.bar-mid { display: flex; gap: 6px 14px; flex-wrap: wrap; font: 500 13px/1.3 var(--font-mono); color: var(--muted); flex: 1 1 auto; min-width: 0; font-variant-numeric: tabular-nums; }
.bar-mid strong { color: var(--ink); font-weight: 600; }
.timer { font: 600 15px/1 var(--font-mono); font-variant-numeric: tabular-nums; padding: 7px 10px; border-radius: 6px; background: var(--surface-2); }
.timer.is-low { background: var(--warn-soft); color: var(--warn); }
.progress { height: 3px; background: var(--surface-2); }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

/* Buttons */
.btn { font: 600 15px/1.2 var(--font-body); padding: 11px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-sm { padding: 7px 12px; font-size: 14px; }
.btn-ghost.is-on { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }

/* Start screen */
.eyebrow { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hero { display: grid; gap: 14px; padding-block: 8px 28px; }
.lang-switch { font-size: 14px; }
.lang-switch a { color: var(--accent); font-weight: 600; }
.hero h1 { font: 700 clamp(32px, 6vw, 48px)/1.04 var(--font-display); letter-spacing: -.02em; }
.lede { max-width: 62ch; color: var(--muted); font-size: 17px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.fact { font: 500 13px/1 var(--font-mono); padding: 8px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.fact b { font-weight: 600; color: var(--accent); }
.block { display: grid; gap: 14px; padding-block: 24px; border-top: 1px solid var(--line); }
.block h2 { font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; }
.note { color: var(--muted); font-size: 14px; max-width: 70ch; }
.resume { display: grid; gap: 12px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--accent); }
.resume h2 { font: 700 19px/1.2 var(--font-display); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.seg { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.seg legend { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 8px; }
.seg-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.seg-opt { position: relative; display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.seg-opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg-opt.is-on { border-color: var(--accent); background: var(--accent-soft); }
.seg-title { font-weight: 600; }
.seg-desc { font-size: 14px; color: var(--muted); }

.dist { display: grid; gap: 14px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: baseline; }
.dname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.dnum { font: 600 12px/1 var(--font-mono); color: var(--accent); }
.den { font-size: 13px; color: var(--muted); }
.dval { font: 500 13px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dbar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.dbar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.formats { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.fmt { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: grid; gap: 2px; }
.fmt-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.fmt-h span:last-child { font: 500 13px var(--font-mono); color: var(--muted); }
.fmt p { font-size: 14px; color: var(--muted); }

/* Question */
.qcard { display: grid; gap: 16px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qcount { font: 600 13px/1 var(--font-mono); color: var(--ink); margin-right: 4px; font-variant-numeric: tabular-nums; }
.chip { font: 500 12px/1.2 var(--font-mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.chip-dom { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.qtopic { font-size: 13px; color: var(--muted); margin-top: -8px; }
.stem { font-size: 18px; line-height: 1.6; max-width: 70ch; }
.hint { font-size: 14px; color: var(--muted); }

.code { margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--term-bg); border: 1px solid var(--term-line); }
.code figcaption { font: 500 12px/1.3 var(--font-mono); color: var(--term-muted); padding: 8px 14px; border-bottom: 1px solid var(--term-line); }
.code-body { overflow-x: auto; padding-block: 10px; font: 13.5px/1.65 var(--font-mono); color: var(--term-ink); }
.cl { display: flex; width: max-content; min-width: 100%; white-space: pre; padding: 0 14px 0 11px; border-left: 3px solid transparent; }
.ln { flex: none; width: 2.4em; padding-right: 1em; text-align: right; color: var(--term-muted); user-select: none; }
.hl-btn { border-top: 0; border-right: 0; border-bottom: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.hl-btn:hover:not(:disabled) { background: var(--term-hover); }
.hl-btn:disabled { cursor: default; }
.hl-btn.is-sel { background: var(--term-sel); border-left-color: var(--term-jinja); }
.hl-btn.is-correct { background: var(--term-pass); border-left-color: var(--term-pass-ink); }
.hl-btn.is-wrong { background: var(--term-fail); border-left-color: var(--term-fail-ink); }
.t-jinja { color: var(--term-jinja); }
.t-str { color: var(--term-str); }
.t-key { color: var(--term-key); }
.t-com { color: var(--term-muted); font-style: italic; }
.t-pass { color: var(--term-pass-ink); }
.t-fail { color: var(--term-fail-ink); }
.t-warn { color: var(--term-warn-ink); }
.t-muted { color: var(--term-muted); }

.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.5; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.is-sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.opt.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.opt-key { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); font: 600 13px/1 var(--font-mono); }
.opt-key.box { border-radius: 4px; }
.opt.is-sel .opt-key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt-body { min-width: 0; padding-top: 2px; }
.opt-mark { font: 600 16px/1.6 var(--font-mono); }
.opt.is-correct .opt-mark { color: var(--pass); }
.opt.is-wrong .opt-mark { color: var(--fail); }
.opt-code { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--term-bg); color: var(--term-ink); font: 13px/1.55 var(--font-mono); white-space: pre; overflow-x: auto; }

.domc { display: grid; gap: 14px; }
.domc-meta { font: 600 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.domc-card { padding: 18px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); font-size: 17px; }
.domc-q { font-weight: 600; }
.domc-actions { display: flex; gap: 10px; }
.domc-actions .btn { min-width: 110px; }
.domc-prev { font-size: 14px; color: var(--muted); }
.domc-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.domc-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.domc-item.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.domc-item.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.domc-verdict { font: 500 12px/1.6 var(--font-mono); color: var(--muted); white-space: nowrap; }

.match { display: grid; gap: 10px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.mrow.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.mrow.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.mleft { min-width: 0; }
.mright { display: grid; gap: 6px; min-width: 0; }
.mright select { width: 100%; font: 15px/1.3 var(--font-body); padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.mfix { font-size: 14px; color: var(--pass); font-weight: 500; }

.ord { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.ord-col { display: grid; gap: 8px; min-width: 0; align-content: start; }
.ord-h { font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ord-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ord-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.45; }
.ord-item:hover:not(:disabled) { border-color: var(--accent); }
.ord-item:disabled { cursor: default; color: var(--ink); }
.ord-item.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.ord-item.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.ord-plus, .ord-n { font: 600 13px/1.45 var(--font-mono); color: var(--accent); min-width: 1.2em; }
.ord-empty { font-size: 14px; color: var(--muted); padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }
.ord-correct { grid-column: 1 / -1; }

.fillbox { display: grid; gap: 8px; max-width: 420px; }
.fill { font: 500 17px/1.3 var(--font-mono); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.fill:focus { border-color: var(--accent); }
.fill.is-correct { border-color: var(--pass); background: var(--pass-soft); }
.fill.is-wrong { border-color: var(--fail); background: var(--fail-soft); }
.fill-exp { font-size: 15px; }

.saved { font-size: 14px; color: var(--muted); padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }

.feedback { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.logline { background: var(--term-bg); color: var(--term-ink); font: 13px/1.5 var(--font-mono); padding: 10px 14px; white-space: pre; overflow-x: auto; }
.fb-body { display: grid; gap: 10px; padding: 16px 18px 18px; max-width: 76ch; }
.fb-title { font: 700 19px/1.2 var(--font-display); }
.fb-pass .fb-title { color: var(--pass); }
.fb-fail .fb-title { color: var(--fail); }
.fb-skip .fb-title { color: var(--warn); }
.fb-body .doc { font-weight: 600; font-size: 15px; justify-self: start; }

.actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.actions > div { display: flex; gap: 10px; flex-wrap: wrap; }
.confirm { margin-top: 14px; display: grid; gap: 12px; padding: 16px; border-radius: var(--radius); border: 1px solid var(--warn); background: var(--warn-soft); }

.map { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; }
.map summary { cursor: pointer; font: 600 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface); display: inline-block; }
.legend i.answered { background: var(--accent-soft); border-color: var(--accent); }
.legend i.correct { background: var(--pass-soft); border-color: var(--pass); }
.legend i.wrong { background: var(--fail-soft); border-color: var(--fail); }
.legend i.flagged { background: var(--warn); border-color: var(--warn); border-radius: 50%; }
.palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.pcell { position: relative; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 13px/1 var(--font-mono); cursor: pointer; font-variant-numeric: tabular-nums; }
.pcell.answered { background: var(--accent-soft); border-color: var(--accent); }
.pcell.correct { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
.pcell.wrong { background: var(--fail-soft); border-color: var(--fail); color: var(--fail); }
.pcell.current { outline: 2px solid var(--ink); outline-offset: 1px; }
.pcell.flagged::after { content: ""; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

/* Results */
.res-head { display: grid; gap: 14px; padding-bottom: 24px; }
.res-head h1 { font: 700 clamp(30px, 5vw, 42px)/1.05 var(--font-display); letter-spacing: -.02em; }
.res-score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.res-pct { font: 700 clamp(56px, 12vw, 88px)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.verdict { font: 600 14px/1 var(--font-mono); padding: 8px 12px; border-radius: 999px; }
.verdict.ok { color: var(--pass); background: var(--pass-soft); }
.verdict.no { color: var(--fail); background: var(--fail-soft); }
.res-dom .dbar > i.ok { background: var(--pass); }
.res-dom .dbar > i.no { background: var(--fail); }
.res-dom .dbar { position: relative; }
.res-dom .dbar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 65%; width: 2px; background: var(--ink); opacity: .5; }
.focus-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Mode panels and fast study */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; padding-bottom: 28px; }
.panel { display: grid; gap: 14px; align-content: start; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
.panel h2 { font: 700 23px/1.15 var(--font-display); letter-spacing: -.01em; }
.panel .seg-opts { grid-template-columns: 1fr; }
.panel .seg-opt { padding: 11px 14px; }
.panel-tag { justify-self: start; font: 600 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.resume h3 { font: 700 17px/1.2 var(--font-display); }
.field, .fast-filter { display: grid; gap: 6px; min-width: 0; }
.field select, .fast-filter select { width: 100%; font: 15px/1.3 var(--font-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.fast-top { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; justify-content: space-between; margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.fast-filter { flex: 1 1 260px; max-width: 440px; }
.fast-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.kbd-hint { font: 500 12px/1.4 var(--font-mono); color: var(--muted); align-self: center; }
.fact-btn { color: var(--ink); cursor: pointer; border-color: var(--accent); }
.fact-btn:hover:not(:disabled) { background: var(--accent-soft); }
.fact-btn.is-on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fact-btn.is-on b { color: var(--accent-ink); }
.fact-btn:disabled { cursor: default; border-color: var(--line); color: var(--muted); }
.res-dom .dbar > i:not(.ok):not(.no) { background: transparent; }
